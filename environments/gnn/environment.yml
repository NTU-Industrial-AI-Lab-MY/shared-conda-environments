name: uricard-gnn
channels:
  - pyg
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.13
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - networkx
  - jupyterlab
  - ipykernel
  - tqdm
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1
  - pyg=2.5.2
  - pip:
      # Keep torch managed by Conda above. Do not add torch, torchvision, or torchaudio here.
      - dgl==2.0.0+cu121 -f https://data.dgl.ai/wheels/cu121/repo.html
